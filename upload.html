<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload | Secure File Hosting</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <div>
      <div class="brand">Secure File Hosting</div>
      <div id="userGreeting" class="small"></div>
    </div>
    <div class="nav-links">
      <a href="/downloads">Downloads</a>
      <a href="/my-files">My Files</a>
      <a href="/upload">Upload</a>
      <button id="logoutBtn">Logout</button>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <h1>Upload a file</h1>
      <p class="subtitle">Supported formats: .pdf and .mp4 only. Maximum size: 20 MB.</p>

      <form id="uploadForm" class="form-grid">
        <div>
          <label for="file">Choose file</label>
          <input type="file" id="file" accept=".pdf,.mp4" required />
        </div>

        <button type="submit">Upload File</button>
      </form>

      <div id="uploadMessage" class="message"></div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    requireAuth();
    attachLogout();
    updateUserGreeting();

    document.getElementById('uploadForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const fileInput = document.getElementById('file');
      const selectedFile = fileInput.files[0];

      if (!selectedFile) {
        showMessage('uploadMessage', 'Please choose a file first', 'error');
        return;
      }

      const formData = new FormData();
      formData.append('file', selectedFile);

      try {
        const response = await fetch('/api/upload', {
          method: 'POST',
          headers: authHeaders(),
          body: formData,
        });

        const data = await response.json();

        if (!response.ok) {
          showMessage('uploadMessage', data.message || 'Upload failed', 'error');
          return;
        }

        showMessage('uploadMessage', 'File uploaded successfully', 'success');
        fileInput.value = '';
      } catch (error) {
        showMessage('uploadMessage', 'Could not connect to server', 'error');
      }
    });
  </script>
</body>
</html>
