<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Secure File Hosting</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="container">
    <div class="hero">
      <h1>Create an account</h1>
      <p>Register with a unique username, email, and password.</p>
    </div>

    <div class="card">
      <form id="registerForm" class="form-grid">
        <div>
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter username" required />
        </div>

        <div>
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter email" required />
        </div>

        <div>
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required />
        </div>

        <button type="submit">Register</button>
      </form>

      <div id="registerMessage" class="message"></div>

      <p class="center-link">Already have an account? <a href="/login">Login here</a></p>
    </div>
  </div>

  <script src="/js/common.js"></script>
 <script src="/js/register.js"></script>
</body>
</html>
