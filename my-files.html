<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Files | Secure File Hosting</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <div>
      <div class="brand">Secure File Hosting</div>
      <div id="userGreeting" class="small"></div>
    </div>
    <div class="nav-links">
      <a href="/downloads">Downloads</a>
      <a href="/my-files">My Files</a>
      <a href="/upload">Upload</a>
      <button id="logoutBtn">Logout</button>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <h1>My Files</h1>
      <p class="subtitle">Only the files uploaded by the currently logged-in user are shown here.</p>

      <div id="myFilesMessage" class="message"></div>

      <div class="table-wrapper">
        <table class="table">
          <thead>
            <tr>
              <th>Filename</th>
              <th>File Size</th>
              <th>Uploaded At</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="myFilesTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    requireAuth();
    attachLogout();
    updateUserGreeting();

    async function loadMyFiles() {
      try {
        const response = await fetch('/api/my-files', {
          headers: authHeaders(),
        });

        const data = await response.json();

        if (!response.ok) {
          if (response.status === 401) {
            clearSession();
            window.location.href = '/login';
            return;
          }
          showMessage('myFilesMessage', data.message || 'Could not load your files', 'error');
          return;
        }

        const tableBody = document.getElementById('myFilesTableBody');
        tableBody.innerHTML = '';

        if (data.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="4">You have not uploaded any files yet.</td></tr>';
          return;
        }

        data.forEach((file) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${file.filename}</td>
            <td>${formatBytes(file.size)}</td>
            <td>${formatDate(file.uploaded_at)}</td>
            <td>
              <div class="actions">
                <button class="secondary-btn" onclick="downloadFile('${file.id}')">Download</button>
                <button class="danger-btn" onclick="deleteFile('${file.id}')">Delete</button>
              </div>
            </td>
          `;
          tableBody.appendChild(row);
        });
      } catch (error) {
        showMessage('myFilesMessage', 'Could not connect to server', 'error');
      }
    }

    async function downloadFile(fileId) {
      try {
        const response = await fetch(`/api/files/${fileId}/download`, {
          headers: authHeaders(),
        });

        if (!response.ok) {
          const errorData = await response.json();
          showMessage('myFilesMessage', errorData.message || 'Download failed', 'error');
          return;
        }

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = '';
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.URL.revokeObjectURL(url);
      } catch (error) {
        showMessage('myFilesMessage', 'Could not download file', 'error');
      }
    }

    async function deleteFile(fileId) {
      const confirmed = window.confirm('Are you sure you want to delete this file?');
      if (!confirmed) return;

      try {
        const response = await fetch(`/api/files/${fileId}`, {
          method: 'DELETE',
          headers: authHeaders(),
        });

        const data = await response.json();

        if (!response.ok) {
          showMessage('myFilesMessage', data.message || 'Delete failed', 'error');
          return;
        }

        showMessage('myFilesMessage', 'File deleted successfully', 'success');
        loadMyFiles();
      } catch (error) {
        showMessage('myFilesMessage', 'Could not connect to server', 'error');
      }
    }

    loadMyFiles();
  </script>
</body>
</html>
